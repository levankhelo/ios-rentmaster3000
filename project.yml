name: DamageReportMaker

options:
  bundleIdPrefix: com.levankhelo
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DamageReportMaker:
    type: application
    platform: iOS
    sources:
      - path: DamageReportMaker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levankhelo.DamageReportMaker
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Damage Report Maker"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  DamageReportMakerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DamageReportMakerTests
    dependencies:
      - target: DamageReportMaker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levankhelo.DamageReportMakerTests
        GENERATE_INFOPLIST_FILE: "YES"

  DamageReportMakerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DamageReportMakerUITests
    dependencies:
      - target: DamageReportMaker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levankhelo.DamageReportMakerUITests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  DamageReportMaker:
    build:
      targets:
        DamageReportMaker: all
        DamageReportMakerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DamageReportMakerTests
        - DamageReportMakerUITests
